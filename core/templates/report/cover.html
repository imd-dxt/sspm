<div class="cover no-break">

  <!-- HPS logo, centered top -->
  <div class="cover-logo-wrap">
    {% if logo_url %}
    <img src="{{ logo_url }}" alt="HPS" class="cover-logo-img">
    {% else %}
    <span class="cover-logo-text">HPS</span>
    {% endif %}
  </div>

  <!-- Decorative navy accent line -->
  <div class="cover-accent-line"></div>

  <!-- Title block, centered -->
  <div class="cover-title-block">
    <span class="cover-classification">{{ classification | default('Confidential') }}</span>
    <h1 class="cover-title">Cybersecurity<br>Compliance Report</h1>
    <p class="cover-subtitle">SaaS Security Posture Assessment</p>
  </div>

  <!-- Light footer with org and date -->
  <div class="cover-footer">
    <div class="cover-footer-org">
      {{ organisation_name | default('Your Organisation') }}
    </div>
    <div class="cover-footer-date">
      {{ generated_at | default('') }}
    </div>
    <div class="cover-footer-brand">
      Prepared by HPS &mdash; SSPM Platform
    </div>
  </div>

</div>
