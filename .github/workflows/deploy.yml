name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── Job 1: Tests ─────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q
        env:
          POSTGRES_URL:    sqlite:///./test.db
          NEO4J_URI:       bolt://localhost:7687
          NEO4J_USER:      neo4j
          NEO4J_PASSWORD:  test
          REDIS_URL:       redis://localhost:6379/0
          ENCRYPTION_KEY:  ${{ secrets.ENCRYPTION_KEY }}

  # ── Job 2: Build & push Docker image ─────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 3: Deploy to DigitalOcean Droplet ────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DROPLET_IP }}
          username: sspm
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs:     GITHUB_ACTOR,GITHUB_REPOSITORY,GITHUB_TOKEN
          script: |
            set -e
            cd /opt/sspm

            # Fetch latest compose file and scripts
            git pull origin main

            # Authenticate with GHCR using the workflow's GITHUB_TOKEN
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull the newly built image
            docker pull ghcr.io/$GITHUB_REPOSITORY:latest

            # Zero-downtime api restart (infra services untouched)
            docker compose -f docker/docker-compose.yml up -d --no-deps api

            # Migrations run inside the container CMD, but run explicitly here
            # too so any failure is visible in the Actions log
            docker compose -f docker/docker-compose.yml exec -T api alembic upgrade head

            # Remove dangling images to reclaim disk space
            docker image prune -f

            echo "Deployment complete — $(date -u)"
