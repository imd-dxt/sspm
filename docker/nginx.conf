server {
    listen 80;

    # ── API proxy ─────────────────────────────────────────────────────────────
    # Forward /api/* and /health to the FastAPI container.
    # The path is passed through unchanged so /api/v1/connectors reaches FastAPI
    # as /api/v1/connectors (matching the API_V1 prefix in api/main.py).

    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets for 1 year
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
        try_files          $uri =404;
    }

    # All other routes → React router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
