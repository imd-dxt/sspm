rule_pack:
  id: iso27001_2022_privileged_access_rules
  name: ISO/IEC 27001:2022 - Privileged Access and Access Control Rule Pack
  version: 1.0.0
  framework: ISO/IEC 27001
  framework_version: '2022'
  scope_note: ISO/IEC 27001:2022 does not have a single control named 'Management of Privileged Access' like CIS Control 6.
    The closest and most relevant Annex A controls are mapped here, especially A.8.2 Privileged access rights, plus supporting
    access management, authentication, and logging controls.
  target_system: SSPM
  generated_at: '2026-05-10'
  mapped_controls:
  - id: A.5.15
    title: Access control
  - id: A.5.16
    title: Identity management
  - id: A.5.17
    title: Authentication information
  - id: A.5.18
    title: Access rights
  - id: A.8.2
    title: Privileged access rights
  - id: A.8.3
    title: Information access restriction
  - id: A.8.4
    title: Access to source code
  - id: A.8.5
    title: Secure authentication
  - id: A.8.15
    title: Logging
  - id: A.8.18
    title: Use of privileged utility programs
  normalized_schema_assumptions:
    resource_types:
    - user_account
    - admin_account
    - service_account
    - external_identity
    - group
    - role
    - permission_assignment
    - saas_application
    - source_code_repository
    - authentication_policy
    - privileged_utility
    - audit_log_configuration
    common_fields:
    - provider
    - resource_type
    - resource_id
    - name
    - attributes.status
    - attributes.owner
    - attributes.is_privileged
    - attributes.roles
    - attributes.permissions
    - attributes.mfa_enabled
    - attributes.secure_authentication_required
    - attributes.authentication_methods
    - attributes.local_login_enabled
    - attributes.sso_enforced
    - attributes.directory_managed
    - attributes.approval_ticket_id
    - attributes.approved_by
    - attributes.approved_at
    - attributes.last_access_review_at
    - attributes.last_login_at
    - attributes.last_rotated_at
    - attributes.secret_expiry_days
    - attributes.access_level
    - attributes.source_code_access
    - attributes.production_access
    - attributes.logging_enabled
    - attributes.privileged_activity_logging_enabled
    - attributes.utility_program_restricted
  severity_mapping:
    critical: Active privileged access can be used without strong authentication, accountability, or restriction.
    high: Privileged, production, or source-code access violates approval, least-privilege, review, or authentication expectations.
    medium: Access governance, identity lifecycle, or logging evidence is incomplete.
    low: Documentation or metadata needed for ISO-style access governance is missing.
rules:
- id: iso27001-a-5-15-access-control-policy-missing
  name: Applications must be covered by an access control policy
  iso27001_control:
    id: A.5.15
    title: Access control
  description: Detect SaaS applications or platforms that are not mapped to a documented access control policy.
  scope:
    resource_types:
    - saas_application
    - application
  severity: medium
  condition:
    any:
    - field: attributes.access_control_policy_id
      operator: not_exists
    - field: attributes.access_control_policy_mapped
      operator: not_equals
      value: true
  evidence:
  - attributes.access_control_policy_id
  - attributes.access_control_policy_mapped
  - attributes.owner
  - attributes.business_criticality
  remediation:
    summary: Map the application to an approved access control policy.
    steps:
    - Identify the application owner.
    - Assign or create a topic-specific access control policy.
    - Define user, administrator, service account, and external identity access rules.
    - Record the policy reference in the SSPM inventory.
  enabled: true
- id: iso27001-a-5-15-access-not-aligned-with-policy
  name: Access assignments must align with the access control policy
  iso27001_control:
    id: A.5.15
    title: Access control
  description: Detect access grants that violate the assigned application or organizational access control policy.
  scope:
    resource_types:
    - permission_assignment
    - role_assignment
    - user_account
    - admin_account
    - service_account
  severity: high
  condition:
    all:
    - field: attributes.access_control_policy_mapped
      operator: equals
      value: true
    - field: attributes.violates_access_control_policy
      operator: equals
      value: true
  evidence:
  - attributes.access_control_policy_id
  - attributes.violated_policy_rule
  - attributes.roles
  - attributes.permissions
  - attributes.owner
  remediation:
    summary: Bring access into alignment with the documented access policy.
    steps:
    - Review the violated policy rule.
    - Remove or adjust the non-compliant role or permission.
    - Record an approved exception if business-justified.
    - Schedule the assignment for the next access review.
  enabled: true
- id: iso27001-a-5-16-identity-without-owner
  name: Every identity must have an accountable owner
  iso27001_control:
    id: A.5.16
    title: Identity management
  description: Detect active human, external, administrator, or service identities without an accountable owner.
  scope:
    resource_types:
    - user_account
    - admin_account
    - service_account
    - external_identity
  severity: medium
  condition:
    all:
    - field: attributes.status
      operator: equals
      value: active
    - any:
      - field: attributes.owner
        operator: not_exists
      - field: attributes.owner
        operator: is_empty
  evidence:
  - attributes.owner
  - attributes.status
  - attributes.created_at
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Assign ownership or disable the identity.
    steps:
    - Identify the business or technical owner.
    - For service accounts, document the owning system and responsible team.
    - For external identities, document the sponsor.
    - Disable the identity if no owner can be identified.
  enabled: true
- id: iso27001-a-5-16-shared-admin-identity
  name: Privileged identities should be individually attributable
  iso27001_control:
    id: A.5.16
    title: Identity management
  description: Detect shared or generic privileged identities that reduce accountability.
  scope:
    resource_types:
    - admin_account
    - user_account
  severity: high
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - any:
      - field: attributes.shared_account
        operator: equals
        value: true
      - field: attributes.account_type
        operator: equals
        value: generic
    - field: attributes.break_glass
      operator: not_equals
      value: true
  evidence:
  - attributes.is_privileged
  - attributes.shared_account
  - attributes.account_type
  - attributes.break_glass
  - attributes.roles
  - attributes.last_login_at
  remediation:
    summary: Replace shared privileged accounts with named administrative identities.
    steps:
    - Create named privileged accounts for approved administrators.
    - Remove routine use of the shared privileged account.
    - If a break-glass account is required, document ownership, controls, MFA, monitoring, and emergency use process.
    - Review logs for prior shared account usage.
  enabled: true
- id: iso27001-a-5-17-authentication-secret-not-rotated
  name: Authentication information must be protected and rotated when required
  iso27001_control:
    id: A.5.17
    title: Authentication information
  description: Detect passwords, API keys, tokens, or service account secrets that have not been rotated within the configured
    threshold.
  scope:
    resource_types:
    - user_account
    - admin_account
    - service_account
    - api_token
    - secret
  severity: high
  parameters:
    max_secret_age_days: 180
  condition:
    any:
    - field: attributes.last_rotated_at
      operator: not_exists
    - field: attributes.last_rotated_at
      operator: older_than_days
      value: 180
  evidence:
  - attributes.last_rotated_at
  - attributes.secret_type
  - attributes.owner
  - attributes.is_privileged
  - attributes.last_used_at
  remediation:
    summary: Rotate or revoke stale authentication information.
    steps:
    - Confirm whether the credential is still required.
    - Rotate the password, token, key, or secret.
    - Update dependent integrations securely.
    - Revoke unused credentials.
  enabled: true
- id: iso27001-a-5-17-cleartext-secret-detected
  name: Authentication information must not be exposed in cleartext
  iso27001_control:
    id: A.5.17
    title: Authentication information
  description: Detect credentials, API keys, app passwords, or tokens stored or exposed in cleartext metadata, comments, repositories,
    tickets, or configuration fields.
  scope:
    resource_types:
    - secret
    - source_code_repository
    - issue
    - configuration_item
    - service_account
  severity: critical
  condition:
    all:
    - field: attributes.contains_authentication_secret
      operator: equals
      value: true
    - field: attributes.secret_protected
      operator: not_equals
      value: true
  evidence:
  - attributes.secret_type
  - attributes.exposure_location
  - attributes.secret_protected
  - attributes.detected_at
  - attributes.owner
  remediation:
    summary: Remove the exposed secret and rotate it immediately.
    steps:
    - Remove the cleartext secret from the exposed location.
    - Rotate or revoke the exposed credential.
    - Review access logs for unauthorized use.
    - Store future secrets in an approved secrets manager.
  enabled: true
- id: iso27001-a-5-18-access-grant-without-approval
  name: Access rights must be approved before assignment
  iso27001_control:
    id: A.5.18
    title: Access rights
  description: Detect active access grants without an approval record.
  scope:
    resource_types:
    - permission_assignment
    - role_assignment
    - user_account
    - admin_account
    - service_account
  severity: medium
  condition:
    all:
    - field: attributes.status
      operator: equals
      value: active
    - any:
      - field: attributes.approval_ticket_id
        operator: not_exists
      - field: attributes.approved_by
        operator: not_exists
      - field: attributes.approved_at
        operator: not_exists
  evidence:
  - attributes.approval_ticket_id
  - attributes.approved_by
  - attributes.approved_at
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Validate or revoke the access assignment.
    steps:
    - Confirm business need with the resource owner.
    - Attach approval evidence or submit the access for retroactive approval if allowed.
    - Remove access if it cannot be justified.
    - Require future access changes to follow the standard approval workflow.
  enabled: true
- id: iso27001-a-5-18-access-review-overdue
  name: Access rights must be reviewed periodically
  iso27001_control:
    id: A.5.18
    title: Access rights
  description: Detect users, roles, groups, or permission assignments with missing or overdue access reviews.
  scope:
    resource_types:
    - user_account
    - admin_account
    - service_account
    - group
    - role
    - permission_assignment
  severity: medium
  parameters:
    max_access_review_age_days: 365
  condition:
    any:
    - field: attributes.last_access_review_at
      operator: not_exists
    - field: attributes.last_access_review_at
      operator: older_than_days
      value: 365
  evidence:
  - attributes.last_access_review_at
  - attributes.review_frequency_days
  - attributes.owner
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Perform an access review and remove unnecessary rights.
    steps:
    - Ask the resource owner to certify the access.
    - Remove access no longer required.
    - Record reviewer, review date, result, and next review date.
    - Prioritize privileged and external access first.
  enabled: true
- id: iso27001-a-5-18-terminated-user-account-active
  name: Access rights must be removed when no longer required
  iso27001_control:
    id: A.5.18
    title: Access rights
  description: Detect active accounts for terminated users or users whose access should have been removed.
  scope:
    resource_types:
    - user_account
    - admin_account
    - external_identity
  severity: critical
  condition:
    all:
    - any:
      - field: attributes.terminated_user
        operator: equals
        value: true
      - field: attributes.revocation_due_at
        operator: older_than_now
    - field: attributes.status
      operator: equals
      value: active
  evidence:
  - attributes.terminated_user
  - attributes.revocation_due_at
  - attributes.status
  - attributes.last_login_at
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Disable the account and revoke access.
    steps:
    - Disable the account while preserving audit history where required.
    - Remove roles, group memberships, tokens, and active sessions.
    - Verify downstream SaaS deprovisioning completed.
    - Record closure in the access revocation workflow.
  enabled: true
- id: iso27001-a-8-2-privileged-access-without-approval
  name: Privileged access rights must be explicitly authorized
  iso27001_control:
    id: A.8.2
    title: Privileged access rights
  description: Detect active privileged access rights without explicit authorization.
  scope:
    resource_types:
    - admin_account
    - role_assignment
    - permission_assignment
    - service_account
    privileged_only: true
  severity: critical
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
    - any:
      - field: attributes.approved_by
        operator: not_exists
      - field: attributes.approved_at
        operator: not_exists
      - field: attributes.approval_ticket_id
        operator: not_exists
  evidence:
  - attributes.is_privileged
  - attributes.roles
  - attributes.permissions
  - attributes.approved_by
  - attributes.approved_at
  - attributes.approval_ticket_id
  remediation:
    summary: Remove or formally approve the privileged access.
    steps:
    - Validate the privileged access with the system owner.
    - Remove it if no business need exists.
    - Record explicit approval if the access is required.
    - Set an expiration date for temporary privileged access.
  enabled: true
- id: iso27001-a-8-2-privileged-access-without-mfa
  name: Privileged access must require strong authentication
  iso27001_control:
    id: A.8.2
    title: Privileged access rights
  description: Detect privileged accounts where MFA or an equivalent strong authentication requirement is not enabled.
  scope:
    resource_types:
    - admin_account
    - user_account
    - service_account
    privileged_only: true
  severity: critical
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
    - all:
      - field: attributes.mfa_enabled
        operator: not_equals
        value: true
      - field: attributes.secure_authentication_required
        operator: not_equals
        value: true
  evidence:
  - attributes.is_privileged
  - attributes.mfa_enabled
  - attributes.secure_authentication_required
  - attributes.authentication_methods
  - attributes.roles
  remediation:
    summary: Require MFA or stronger authentication for privileged access.
    steps:
    - Enable MFA for the privileged identity.
    - Prefer phishing-resistant methods for highly privileged roles.
    - Block privileged sign-in until enrollment is complete if policy allows.
    - Verify no direct login path bypasses SSO or conditional access.
  enabled: true
- id: iso27001-a-8-2-privileged-access-not-least-privilege
  name: Privileged access must be restricted to the minimum necessary
  iso27001_control:
    id: A.8.2
    title: Privileged access rights
  description: Detect privileged users or service accounts whose permissions exceed the approved baseline.
  scope:
    resource_types:
    - admin_account
    - service_account
    - permission_assignment
    privileged_only: true
  severity: high
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - any:
      - field: attributes.permissions_exceed_role_baseline
        operator: equals
        value: true
      - field: attributes.overprivileged
        operator: equals
        value: true
  evidence:
  - attributes.roles
  - attributes.actual_permissions
  - attributes.expected_permissions
  - attributes.excess_permissions
  - attributes.last_access_review_at
  remediation:
    summary: Reduce privileged rights to the approved minimum.
    steps:
    - Compare actual permissions with the approved role baseline.
    - Remove excess administrative permissions.
    - Document any approved exceptions.
    - Re-test the account after privilege reduction.
  enabled: true
- id: iso27001-a-8-2-privileged-access-review-overdue
  name: Privileged access rights must be reviewed more frequently
  iso27001_control:
    id: A.8.2
    title: Privileged access rights
  description: Detect privileged accounts or assignments whose privileged-access review is missing or overdue.
  scope:
    resource_types:
    - admin_account
    - service_account
    - role_assignment
    - permission_assignment
    privileged_only: true
  severity: high
  parameters:
    max_privileged_review_age_days: 90
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - any:
      - field: attributes.last_privileged_access_review_at
        operator: not_exists
      - field: attributes.last_privileged_access_review_at
        operator: older_than_days
        value: 90
  evidence:
  - attributes.last_privileged_access_review_at
  - attributes.owner
  - attributes.roles
  - attributes.permissions
  - attributes.is_privileged
  remediation:
    summary: Perform a privileged access review.
    steps:
    - Ask the system owner to certify the privileged access.
    - Remove unnecessary privileged permissions.
    - Record review outcome and reviewer.
    - Schedule the next privileged access review.
  enabled: true
- id: iso27001-a-8-2-standing-admin-access-without-expiry
  name: Temporary privileged access should have an expiry
  iso27001_control:
    id: A.8.2
    title: Privileged access rights
  description: Detect privileged access assignments that appear temporary or elevated but do not have an expiration date.
  scope:
    resource_types:
    - admin_account
    - role_assignment
    - permission_assignment
    privileged_only: true
  severity: high
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - any:
      - field: attributes.access_type
        operator: equals
        value: temporary
      - field: attributes.elevation_source
        operator: exists
    - field: attributes.expires_at
      operator: not_exists
  evidence:
  - attributes.access_type
  - attributes.elevation_source
  - attributes.expires_at
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Set an expiration or convert the access to a controlled standing role.
    steps:
    - Confirm the intended duration of the access.
    - Set an expiration date or revoke the elevated permissions.
    - Use just-in-time privileged access where supported.
    - Record the approval and expiry in the access workflow.
  enabled: true
- id: iso27001-a-8-3-sensitive-information-access-unrestricted
  name: Access to sensitive information must be restricted
  iso27001_control:
    id: A.8.3
    title: Information access restriction
  description: Detect users, groups, roles, or service accounts with access to sensitive information without business justification.
  scope:
    resource_types:
    - permission_assignment
    - group
    - role
    - user_account
    - service_account
  severity: high
  condition:
    all:
    - field: attributes.sensitive_information_access
      operator: equals
      value: true
    - any:
      - field: attributes.business_justification
        operator: not_exists
      - field: attributes.approved_by_data_owner
        operator: not_equals
        value: true
  evidence:
  - attributes.sensitive_information_access
  - attributes.data_classification
  - attributes.business_justification
  - attributes.approved_by_data_owner
  - attributes.permissions
  remediation:
    summary: Restrict sensitive information access to authorized users only.
    steps:
    - Confirm the data owner and business justification.
    - Remove unnecessary access to sensitive information.
    - Apply group- or role-based restrictions.
    - Record an approved exception if access is required.
  enabled: true
- id: iso27001-a-8-4-source-code-admin-access-unapproved
  name: Privileged source code access must be restricted and approved
  iso27001_control:
    id: A.8.4
    title: Access to source code
  description: Detect administrative or write access to source code repositories without approval or repository-owner authorization.
  scope:
    resource_types:
    - source_code_repository
    - permission_assignment
    - user_account
    - admin_account
  severity: high
  condition:
    all:
    - field: attributes.source_code_access
      operator: equals
      value: true
    - field: attributes.access_level
      operator: in
      value:
      - admin
      - maintain
      - write
      - owner
    - any:
      - field: attributes.approved_by_repo_owner
        operator: not_equals
        value: true
      - field: attributes.approval_ticket_id
        operator: not_exists
  evidence:
  - attributes.source_code_access
  - attributes.access_level
  - attributes.repository
  - attributes.approved_by_repo_owner
  - attributes.approval_ticket_id
  remediation:
    summary: Restrict source code access to approved contributors and maintainers.
    steps:
    - Ask the repository owner to validate access.
    - Downgrade or remove write, maintain, admin, or owner permissions if not required.
    - Use groups or teams to manage repository access.
    - Require code-owner and branch protection controls where available.
  enabled: true
- id: iso27001-a-8-5-secure-authentication-not-enforced
  name: Secure authentication must be enforced for business applications
  iso27001_control:
    id: A.8.5
    title: Secure authentication
  description: Detect business-critical or externally exposed applications where secure authentication is not enforced.
  scope:
    resource_types:
    - saas_application
    - authentication_policy
    - identity_provider_application
  severity: high
  condition:
    all:
    - any:
      - field: attributes.business_criticality
        operator: in
        value:
        - high
        - critical
      - field: attributes.externally_exposed
        operator: equals
        value: true
    - field: attributes.secure_authentication_required
      operator: not_equals
      value: true
  evidence:
  - attributes.business_criticality
  - attributes.externally_exposed
  - attributes.secure_authentication_required
  - attributes.mfa_required
  - attributes.sso_enforced
  remediation:
    summary: Apply secure authentication controls.
    steps:
    - Enforce SSO where supported.
    - Require MFA for users and administrators.
    - Disable legacy or weak authentication methods.
    - Verify the policy applies to all relevant groups and locations.
  enabled: true
- id: iso27001-a-8-5-legacy-authentication-enabled
  name: Legacy or weak authentication methods should be disabled
  iso27001_control:
    id: A.8.5
    title: Secure authentication
  description: Detect applications or accounts that allow legacy, weak, or non-interactive authentication methods that bypass
    modern controls.
  scope:
    resource_types:
    - saas_application
    - authentication_policy
    - user_account
    - admin_account
  severity: high
  condition:
    any:
    - field: attributes.legacy_authentication_enabled
      operator: equals
      value: true
    - field: attributes.basic_auth_enabled
      operator: equals
      value: true
    - field: attributes.app_password_enabled
      operator: equals
      value: true
  evidence:
  - attributes.legacy_authentication_enabled
  - attributes.basic_auth_enabled
  - attributes.app_password_enabled
  - attributes.authentication_methods
  - attributes.last_login_at
  remediation:
    summary: Disable weak authentication methods.
    steps:
    - Disable legacy authentication, basic authentication, or app passwords.
    - Migrate integrations to approved modern authentication.
    - Monitor for failed legacy authentication attempts.
    - Create exceptions only with documented compensating controls.
  enabled: true
- id: iso27001-a-8-15-privileged-activity-logging-disabled
  name: Privileged activity must be logged
  iso27001_control:
    id: A.8.15
    title: Logging
  description: Detect privileged accounts, applications, or platforms where privileged activity logging is disabled or incomplete.
  scope:
    resource_types:
    - audit_log_configuration
    - saas_application
    - admin_account
    - identity_provider
  severity: critical
  condition:
    all:
    - any:
      - field: attributes.has_privileged_users
        operator: equals
        value: true
      - field: attributes.is_privileged
        operator: equals
        value: true
    - field: attributes.privileged_activity_logging_enabled
      operator: not_equals
      value: true
  evidence:
  - attributes.has_privileged_users
  - attributes.is_privileged
  - attributes.privileged_activity_logging_enabled
  - attributes.logging_enabled
  - attributes.log_retention_days
  remediation:
    summary: Enable logging for privileged activity.
    steps:
    - Enable administrative activity logs in the SaaS platform or identity provider.
    - Forward logs to the SIEM or approved log store.
    - Validate retention and tamper-protection settings.
    - Test that privileged actions produce searchable audit events.
  enabled: true
- id: iso27001-a-8-15-log-retention-too-short
  name: Security logs must meet the required retention period
  iso27001_control:
    id: A.8.15
    title: Logging
  description: Detect SaaS or identity audit logs whose retention is below the configured minimum.
  scope:
    resource_types:
    - audit_log_configuration
    - saas_application
    - identity_provider
  severity: medium
  parameters:
    minimum_log_retention_days: 180
  condition:
    any:
    - field: attributes.log_retention_days
      operator: not_exists
    - field: attributes.log_retention_days
      operator: less_than
      value: 180
  evidence:
  - attributes.log_retention_days
  - attributes.logging_enabled
  - attributes.log_destination
  - attributes.owner
  remediation:
    summary: Increase log retention or export logs to an approved store.
    steps:
    - Configure the SaaS or identity provider to retain logs for the required period.
    - If native retention is insufficient, export logs to the SIEM or archive.
    - Verify privileged and authentication events are included.
    - Document any product limitations.
  enabled: true
- id: iso27001-a-8-18-privileged-utility-unrestricted
  name: Privileged utility programs must be restricted
  iso27001_control:
    id: A.8.18
    title: Use of privileged utility programs
  description: Detect privileged utilities, automation tools, or administrative programs that are available to unauthorized
    users.
  scope:
    resource_types:
    - privileged_utility
    - admin_tool
    - automation_tool
    - permission_assignment
  severity: high
  condition:
    all:
    - field: attributes.utility_program_restricted
      operator: not_equals
      value: true
    - any:
      - field: attributes.can_modify_security_configuration
        operator: equals
        value: true
      - field: attributes.can_bypass_controls
        operator: equals
        value: true
      - field: attributes.has_admin_capability
        operator: equals
        value: true
  evidence:
  - attributes.utility_program_restricted
  - attributes.can_modify_security_configuration
  - attributes.can_bypass_controls
  - attributes.has_admin_capability
  - attributes.allowed_users
  remediation:
    summary: Restrict use of privileged utilities to authorized administrators.
    steps:
    - Limit the utility to approved administrator groups.
    - Remove access for standard users and external identities.
    - Enable logging for all utility execution.
    - Require approval for high-risk utility use.
  enabled: true
- id: iso27001-a-8-18-privileged-utility-usage-not-logged
  name: Use of privileged utility programs must be logged
  iso27001_control:
    id: A.8.18
    title: Use of privileged utility programs
  description: Detect privileged utilities that can make high-impact changes without usage logging.
  scope:
    resource_types:
    - privileged_utility
    - admin_tool
    - automation_tool
  severity: high
  condition:
    all:
    - field: attributes.has_admin_capability
      operator: equals
      value: true
    - field: attributes.usage_logging_enabled
      operator: not_equals
      value: true
  evidence:
  - attributes.has_admin_capability
  - attributes.usage_logging_enabled
  - attributes.log_destination
  - attributes.allowed_users
  remediation:
    summary: Enable usage logging for privileged utilities.
    steps:
    - Enable audit logging for the utility or administrative tool.
    - Forward logs to the approved log store or SIEM.
    - Validate that user, action, target, and timestamp are captured.
    - Restrict utility use until logging is enabled if risk is high.
  enabled: true
