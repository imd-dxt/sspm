rule_pack:
  id: cis_csc_6_access_control_management
  name: CIS Critical Security Control 6 - Access Control Management
  version: 1.0.0
  framework: CIS Critical Security Controls
  framework_version: v8.1
  control:
    id: CIS-6
    title: Access Control Management
    focus: Management of privileged access, access granting/revocation, MFA, centralized access control, and RBAC.
    statement: Use processes and tools to create, assign, manage, and revoke access credentials and privileges for user, administrator,
      and service accounts for enterprise assets and software.
  generated_at: '2026-05-10'
  target_system: SSPM
  normalized_schema_assumptions:
    identity:
      resource_type_examples:
      - user_account
      - admin_account
      - service_account
      - external_identity
      - group
      - role
      - permission_assignment
      common_fields:
      - provider
      - resource_type
      - resource_id
      - name
      - attributes.status
      - attributes.is_privileged
      - attributes.mfa_enabled
      - attributes.last_login_at
      - attributes.created_at
      - attributes.owner
      - attributes.source
      - attributes.roles
      - attributes.permissions
      - attributes.external_exposure
      - attributes.sso_managed
      - attributes.directory_managed
      - attributes.approval_ticket_id
      - attributes.approved_by
      - attributes.approved_at
      - attributes.revocation_due_at
      - attributes.terminated_user
      - attributes.role_documented
      - attributes.last_access_review_at
    application:
      resource_type_examples:
      - saas_application
      - remote_access_application
      - auth_system
      - authorization_system
      common_fields:
      - attributes.externally_exposed
      - attributes.remote_network_access
      - attributes.mfa_required
      - attributes.sso_enforced
      - attributes.directory_integrated
      - attributes.inventory_tracked
      - attributes.last_inventory_review_at
  severity_mapping:
    critical: Privileged access can be used without MFA, is unmanaged, or remains active after termination.
    high: Privileged or externally exposed access violates CIS Control 6 safeguards.
    medium: Access governance, inventory, or review process is incomplete.
    low: Documentation or metadata needed for access governance is missing.
rules:
- id: cis-6-1-access-grant-without-approval
  name: Access grants must follow an approved granting process
  cis_safeguard:
    id: '6.1'
    title: Establish an Access Granting Process
    implementation_group: IG1
  description: Detect user, administrator, service account, or permission grants that were created without an approval record
    or role-change/new-hire workflow reference.
  scope:
    resource_types:
    - permission_assignment
    - role_assignment
    - user_account
    - admin_account
    - service_account
    applies_to:
    - github
    - jira
    - salesforce
    - google_workspace
    - microsoft_365
    - slack
    - aws
    - azure
    - okta
    - custom_saas
  severity: medium
  condition:
    all:
    - field: attributes.status
      operator: equals
      value: active
    - any:
      - field: attributes.approval_ticket_id
        operator: not_exists
      - field: attributes.approved_by
        operator: not_exists
      - field: attributes.approved_at
        operator: not_exists
  evidence:
  - attributes.approval_ticket_id
  - attributes.approved_by
  - attributes.approved_at
  - attributes.created_at
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Require every access grant to be tied to an approved new-hire, rights-grant, or role-change workflow.
    steps:
    - Identify the owner of the account or permission assignment.
    - Verify business need and approval history.
    - Attach the missing approval evidence or revoke the access.
    - Route future access grants through the standard access request workflow.
  enabled: true
- id: cis-6-1-privileged-access-grant-without-approval
  name: Privileged access grants must have explicit approval
  cis_safeguard:
    id: '6.1'
    title: Establish an Access Granting Process
    implementation_group: IG1
  description: Detect privileged roles or administrative permissions assigned without explicit approval evidence.
  scope:
    resource_types:
    - admin_account
    - role_assignment
    - permission_assignment
    privileged_only: true
  severity: high
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
    - any:
      - field: attributes.approval_ticket_id
        operator: not_exists
      - field: attributes.approved_by
        operator: not_exists
      - field: attributes.approved_at
        operator: not_exists
  evidence:
  - attributes.is_privileged
  - attributes.roles
  - attributes.permissions
  - attributes.approval_ticket_id
  - attributes.approved_by
  remediation:
    summary: Remove or formally approve privileged access.
    steps:
    - Review the privileged role or permission assignment.
    - Confirm the business justification with the asset owner.
    - Revoke access if no valid approval exists.
    - Require break-glass or privileged-access workflows for future grants.
  enabled: true
- id: cis-6-2-terminated-user-account-active
  name: Terminated users must have access disabled immediately
  cis_safeguard:
    id: '6.2'
    title: Establish an Access Revoking Process
    implementation_group: IG1
  description: Detect active SaaS accounts for users marked as terminated or no longer employed.
  scope:
    resource_types:
    - user_account
    - admin_account
    applies_to:
    - all_saas_providers
  severity: critical
  condition:
    all:
    - field: attributes.terminated_user
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
  evidence:
  - attributes.terminated_user
  - attributes.status
  - attributes.termination_date
  - attributes.last_login_at
  - attributes.roles
  - attributes.permissions
  remediation:
    summary: Disable the account immediately while preserving audit history.
    steps:
    - Disable the SaaS account rather than deleting it when audit retention is required.
    - Revoke active sessions, tokens, API keys, and app passwords.
    - Remove privileged roles and group memberships.
    - Verify the deprovisioning workflow completed in the identity provider and downstream SaaS apps.
  enabled: true
- id: cis-6-2-revocation-overdue
  name: Access revocation must occur when role or rights are removed
  cis_safeguard:
    id: '6.2'
    title: Establish an Access Revoking Process
    implementation_group: IG1
  description: Detect access assignments whose revocation due date has passed but the account or permission is still active.
  scope:
    resource_types:
    - permission_assignment
    - role_assignment
    - user_account
    - admin_account
    - service_account
  severity: high
  condition:
    all:
    - field: attributes.revocation_due_at
      operator: older_than_now
    - field: attributes.status
      operator: equals
      value: active
  evidence:
  - attributes.revocation_due_at
  - attributes.status
  - attributes.roles
  - attributes.permissions
  - attributes.owner
  remediation:
    summary: Complete the pending revocation.
    steps:
    - Disable or remove the overdue role, permission, or account.
    - Invalidate active sessions and tokens where applicable.
    - Confirm downstream SaaS apps received the revocation.
    - Update the revocation workflow record.
  enabled: true
- id: cis-6-3-externally-exposed-app-without-mfa
  name: Externally exposed applications must enforce MFA
  cis_safeguard:
    id: '6.3'
    title: Require MFA for Externally-Exposed Applications
    implementation_group: IG1
  description: Detect externally exposed enterprise or third-party applications where MFA is not enforced directly or through
    SSO/directory policy.
  scope:
    resource_types:
    - saas_application
    - application
    - identity_provider_application
  severity: high
  condition:
    all:
    - field: attributes.externally_exposed
      operator: equals
      value: true
    - all:
      - field: attributes.mfa_required
        operator: not_equals
        value: true
      - field: attributes.sso_mfa_enforced
        operator: not_equals
        value: true
  evidence:
  - attributes.externally_exposed
  - attributes.mfa_required
  - attributes.sso_mfa_enforced
  - attributes.sso_provider
  - attributes.login_url
  remediation:
    summary: Require MFA for the externally exposed application.
    steps:
    - Enable MFA in the SaaS application or enforce it through the connected SSO provider.
    - Apply the MFA policy to all users, including administrators and external collaborators.
    - Test sign-in from an unmanaged network to verify MFA is required.
  enabled: true
- id: cis-6-3-external-user-without-mfa
  name: Users accessing externally exposed applications must have MFA enabled
  cis_safeguard:
    id: '6.3'
    title: Require MFA for Externally-Exposed Applications
    implementation_group: IG1
  description: Detect users who can access externally exposed SaaS applications without MFA.
  scope:
    resource_types:
    - user_account
    - admin_account
    - external_identity
    requires_related_resource: saas_application.attributes.externally_exposed == true
  severity: high
  condition:
    all:
    - field: attributes.can_access_externally_exposed_app
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
    - field: attributes.mfa_enabled
      operator: not_equals
      value: true
  evidence:
  - attributes.can_access_externally_exposed_app
  - attributes.mfa_enabled
  - attributes.accessible_applications
  - attributes.last_login_at
  remediation:
    summary: Enable MFA for the user or block access until MFA enrollment is complete.
    steps:
    - Require the user to enroll an approved MFA factor.
    - Apply conditional access or SSO policies that block non-MFA sign-ins.
    - Review whether the user still needs access to the externally exposed application.
  enabled: true
- id: cis-6-4-remote-network-access-without-mfa
  name: Remote network access must require MFA
  cis_safeguard:
    id: '6.4'
    title: Require MFA for Remote Network Access
    implementation_group: IG1
  description: Detect remote network access applications or configurations, such as VPN or ZTNA, where MFA is not required.
  scope:
    resource_types:
    - remote_access_application
    - vpn_configuration
    - ztna_application
  severity: critical
  condition:
    all:
    - field: attributes.remote_network_access
      operator: equals
      value: true
    - field: attributes.mfa_required
      operator: not_equals
      value: true
  evidence:
  - attributes.remote_network_access
  - attributes.mfa_required
  - attributes.authentication_method
  - attributes.sso_provider
  remediation:
    summary: Require MFA for all remote network access.
    steps:
    - Enable MFA on the VPN, ZTNA, or remote access platform.
    - Integrate remote access with the enterprise SSO provider where possible.
    - Block legacy or local authentication paths that bypass MFA.
  enabled: true
- id: cis-6-5-admin-account-without-mfa
  name: Administrative accounts must use MFA
  cis_safeguard:
    id: '6.5'
    title: Require MFA for Administrative Access
    implementation_group: IG1
  description: Detect administrative or privileged accounts without MFA enabled.
  scope:
    resource_types:
    - admin_account
    - user_account
    - service_account
    privileged_only: true
  severity: critical
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
    - field: attributes.mfa_enabled
      operator: not_equals
      value: true
  evidence:
  - attributes.is_privileged
  - attributes.mfa_enabled
  - attributes.roles
  - attributes.permissions
  - attributes.last_login_at
  remediation:
    summary: Enable MFA for the administrative account immediately.
    steps:
    - Require MFA enrollment for the administrative account.
    - Temporarily remove privileged permissions until MFA is enabled if policy allows.
    - Prefer phishing-resistant MFA for highly privileged access.
    - Verify there are no admin login paths that bypass SSO or conditional access.
  enabled: true
- id: cis-6-5-admin-bypass-of-sso-or-conditional-access
  name: Administrative access must not bypass centralized MFA enforcement
  cis_safeguard:
    id: '6.5'
    title: Require MFA for Administrative Access
    implementation_group: IG1
  description: Detect privileged accounts that can authenticate locally or directly to a SaaS application while bypassing
    SSO or conditional access MFA enforcement.
  scope:
    resource_types:
    - admin_account
    - user_account
    privileged_only: true
  severity: critical
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - field: attributes.status
      operator: equals
      value: active
    - field: attributes.local_login_enabled
      operator: equals
      value: true
    - field: attributes.sso_mfa_enforced
      operator: not_equals
      value: true
  evidence:
  - attributes.local_login_enabled
  - attributes.sso_mfa_enforced
  - attributes.authentication_methods
  - attributes.roles
  remediation:
    summary: Remove direct-login bypass paths for privileged users.
    steps:
    - Disable local password login for privileged SaaS accounts where supported.
    - Require SSO for administrative access.
    - Apply MFA and conditional access to the privileged role or admin group.
    - Keep only controlled break-glass accounts with compensating controls.
  enabled: true
- id: cis-6-6-auth-system-missing-from-inventory
  name: Authentication and authorization systems must be inventoried
  cis_safeguard:
    id: '6.6'
    title: Establish and Maintain an Inventory of Authentication and Authorization Systems
    implementation_group: IG2
  description: Detect authentication or authorization systems that are not tracked in the enterprise inventory.
  scope:
    resource_types:
    - auth_system
    - authorization_system
    - identity_provider
    - sso_provider
    - directory_service
  severity: medium
  condition:
    any:
    - field: attributes.inventory_tracked
      operator: not_equals
      value: true
    - field: attributes.inventory_id
      operator: not_exists
  evidence:
  - attributes.inventory_tracked
  - attributes.inventory_id
  - attributes.owner
  - attributes.provider
  - attributes.last_seen_at
  remediation:
    summary: Add the authentication or authorization system to the enterprise inventory.
    steps:
    - Identify the business and technical owner.
    - Record the system in the enterprise identity-system inventory.
    - Document hosted location, provider, integrated applications, and review cadence.
    - Include the system in recurring inventory reviews.
  enabled: true
- id: cis-6-6-auth-inventory-review-overdue
  name: Authentication and authorization inventory must be reviewed at least annually
  cis_safeguard:
    id: '6.6'
    title: Establish and Maintain an Inventory of Authentication and Authorization Systems
    implementation_group: IG2
  description: Detect authentication or authorization systems whose inventory review is older than the configured maximum
    age.
  scope:
    resource_types:
    - auth_system
    - authorization_system
    - identity_provider
    - sso_provider
    - directory_service
  severity: medium
  parameters:
    max_inventory_review_age_days: 365
  condition:
    any:
    - field: attributes.last_inventory_review_at
      operator: not_exists
    - field: attributes.last_inventory_review_at
      operator: older_than_days
      value: 365
  evidence:
  - attributes.last_inventory_review_at
  - attributes.owner
  - attributes.inventory_id
  - attributes.integrated_applications
  remediation:
    summary: Review and update the identity-system inventory.
    steps:
    - Confirm the system is still active and owned.
    - Validate integrations, administrative users, and access paths.
    - Update inventory metadata and set the next review date.
  enabled: true
- id: cis-6-7-saas-app-not-centrally-managed
  name: Access control should be centralized through SSO or directory service
  cis_safeguard:
    id: '6.7'
    title: Centralize Access Control
    implementation_group: IG2
  description: Detect SaaS applications whose access is not managed through the enterprise directory service or SSO provider,
    where supported.
  scope:
    resource_types:
    - saas_application
    - application
    where_supported: true
  severity: medium
  condition:
    all:
    - field: attributes.supports_sso_or_directory
      operator: equals
      value: true
    - all:
      - field: attributes.sso_enforced
        operator: not_equals
        value: true
      - field: attributes.directory_integrated
        operator: not_equals
        value: true
  evidence:
  - attributes.supports_sso_or_directory
  - attributes.sso_enforced
  - attributes.directory_integrated
  - attributes.local_accounts_enabled
  - attributes.provider
  remediation:
    summary: Centralize application access through SSO or directory integration.
    steps:
    - Integrate the SaaS application with the enterprise SSO or directory provider.
    - Migrate users and groups to centralized access management.
    - Disable unmanaged local accounts where possible.
    - Apply centralized MFA and conditional access policies.
  enabled: true
- id: cis-6-7-unmanaged-local-admins
  name: Local privileged accounts should be minimized when centralized access is supported
  cis_safeguard:
    id: '6.7'
    title: Centralize Access Control
    implementation_group: IG2
  description: Detect local administrative accounts in SaaS applications that support centralized SSO or directory management.
  scope:
    resource_types:
    - admin_account
    - user_account
    privileged_only: true
  severity: high
  condition:
    all:
    - field: attributes.is_privileged
      operator: equals
      value: true
    - field: attributes.source
      operator: equals
      value: local
    - field: attributes.application_supports_sso_or_directory
      operator: equals
      value: true
    - field: attributes.break_glass
      operator: not_equals
      value: true
  evidence:
  - attributes.source
  - attributes.is_privileged
  - attributes.application_supports_sso_or_directory
  - attributes.break_glass
  - attributes.roles
  remediation:
    summary: Convert unmanaged local admin access to centralized identity management.
    steps:
    - Map the local administrator to an SSO-managed identity or group.
    - Remove local privileged permissions after migration.
    - Keep only documented break-glass accounts with strong controls and monitoring.
  enabled: true
- id: cis-6-8-role-without-documented-access-rights
  name: Roles must have documented access rights
  cis_safeguard:
    id: '6.8'
    title: Define and Maintain Role-Based Access Control
    implementation_group: IG2
  description: Detect roles that do not have documented business purpose, assigned permissions, and expected access rights.
  scope:
    resource_types:
    - role
    - group
    - permission_set
  severity: medium
  condition:
    any:
    - field: attributes.role_documented
      operator: not_equals
      value: true
    - field: attributes.business_purpose
      operator: not_exists
    - field: attributes.expected_permissions
      operator: is_empty
  evidence:
  - attributes.role_documented
  - attributes.business_purpose
  - attributes.expected_permissions
  - attributes.actual_permissions
  - attributes.owner
  remediation:
    summary: Document the role and its required access rights.
    steps:
    - Assign a role owner.
    - Document the role's business purpose.
    - Document expected permissions and membership criteria.
    - Remove permissions that are not required for the role's duties.
  enabled: true
- id: cis-6-8-access-review-overdue
  name: Access control reviews must occur at least annually
  cis_safeguard:
    id: '6.8'
    title: Define and Maintain Role-Based Access Control
    implementation_group: IG2
  description: Detect accounts, groups, or roles whose access review is missing or older than the configured maximum review
    age.
  scope:
    resource_types:
    - user_account
    - admin_account
    - service_account
    - group
    - role
    - permission_assignment
  severity: medium
  parameters:
    max_access_review_age_days: 365
  condition:
    any:
    - field: attributes.last_access_review_at
      operator: not_exists
    - field: attributes.last_access_review_at
      operator: older_than_days
      value: 365
  evidence:
  - attributes.last_access_review_at
  - attributes.owner
  - attributes.roles
  - attributes.permissions
  - attributes.review_frequency_days
  remediation:
    summary: Perform and record an access review.
    steps:
    - Review assigned users, roles, groups, and permissions with the resource owner.
    - Remove unauthorized or unnecessary privileges.
    - Record the review result, reviewer, and next review date.
  enabled: true
- id: cis-6-8-excessive-privileges-outside-rbac
  name: Privileges must match the documented RBAC model
  cis_safeguard:
    id: '6.8'
    title: Define and Maintain Role-Based Access Control
    implementation_group: IG2
  description: Detect users or service accounts whose actual permissions exceed the permissions documented for their assigned
    role.
  scope:
    resource_types:
    - user_account
    - admin_account
    - service_account
    - permission_assignment
  severity: high
  condition:
    all:
    - field: attributes.rbac_model_available
      operator: equals
      value: true
    - field: attributes.permissions_exceed_role_baseline
      operator: equals
      value: true
  evidence:
  - attributes.roles
  - attributes.actual_permissions
  - attributes.expected_permissions
  - attributes.excess_permissions
  - attributes.last_access_review_at
  remediation:
    summary: Align actual permissions with the documented RBAC baseline.
    steps:
    - Compare actual permissions against the documented role baseline.
    - Remove excess permissions or update the role definition if the access is justified.
    - Require owner approval for any exception.
    - Schedule the account for the next recurring access review.
  enabled: true
